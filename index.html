<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="たまごから育てて、ずかんを埋める1画面の育成ゲーム（非公式ファンゲーム）">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#b3a6e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ちびそだて">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>html,body{height:100%}body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}</style>
<title>ちびそだて</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="device">
  <!-- 上：ステータス -->
  <header id="hud">
    <div class="hud-top">
      <div class="nameplate">
        <span id="hud-stage" class="stage-chip">たまご</span>
        <span id="hud-name">？？？</span>
      </div>
      <div class="hud-right">
        <span id="hud-miss" class="miss" title="お世話ミス"></span>
        <button id="btn-home" class="icon-btn" aria-label="おうち" hidden>
          <svg viewBox="0 0 16 16"><path d="M7 1h2v1h1v1h1v1h1v1h1v1h1v2h-1v7H3V8H2V6h1V5h1V4h1V3h1V2h1z" fill="currentColor"/><rect x="7" y="10" width="2" height="4" fill="var(--panel)"/></svg>
        </button>
        <button id="btn-zukan" class="icon-btn" aria-label="ずかん">
          <svg viewBox="0 0 16 16"><path d="M2 2h5v1h2V2h5v11H9v1H7v-1H2z" fill="currentColor"/><path d="M8 4v8" stroke="var(--panel)" stroke-width="1"/></svg>
        </button>
        <button id="btn-settings" class="icon-btn" aria-label="せってい">
          <svg viewBox="0 0 16 16"><path d="M7 1h2v2h2v2h2v2h2v2h-2v2h-2v2H9v2H7v-2H5v-2H3V9H1V7h2V5h2V3h2z" fill="currentColor"/><rect x="6" y="6" width="4" height="4" fill="var(--panel)"/></svg>
        </button>
      </div>
    </div>
    <div id="meters" class="meters">
      <div class="meter" data-k="hunger"><span>おなか</span><i><b></b></i></div>
      <div class="meter" data-k="happy"><span>きげん</span><i><b></b></i></div>
      <div class="meter" data-k="clean"><span>せいけつ</span><i><b></b></i></div>
      <div class="meter" data-k="energy"><span>げんき</span><i><b></b></i></div>
      <div class="meter" data-k="growth"><span>成長</span><i><b></b></i></div>
      <div class="meter" data-k="shitsuke"><span>しつけ</span><i><b></b></i></div>
      <div class="meter" data-k="style" hidden><span>せいかく</span><i><b></b></i></div>
    </div>
    <div id="callhint" class="callhint" hidden></div>
    <div id="growth" class="growth" hidden><i><b></b></i><span id="growth-label"></span></div>
    <div id="eggpanel" class="eggpanel">
      <div class="erow"><span>おんど</span><div class="thermo"><div class="zone"></div><div id="egg-temp" class="needle"></div></div><span id="egg-temp-label" class="elabel">さむい</span></div>
      <div class="erow"><span>かえるまで</span><div id="egg-hatch" class="ebar"><b></b></div></div>
    </div>
  </header>

  <!-- 中：ゲーム画面 -->
  <main id="stage" data-time="day">
    <div class="sky"></div>
    <div class="window"><div class="orb"></div><div class="pane"></div></div>
    <div class="shelf"></div>
    <div class="floor"></div>
    <div id="dirt" class="dirt"></div>
    <div id="actor" class="actor">
      <div class="shadow"></div>
      <div class="body"><img id="actor-img" alt="" draggable="false"></div>
      <div id="call" class="call" hidden>!</div>
      <div id="look" class="look" hidden></div>
      <div id="zzz" class="zzz" hidden>Z<span>z</span><span>z</span></div>
    </div>
    <div id="neighbors"></div>
    <div id="fx"></div>
    <div id="home-hint" class="home-hint" hidden></div>
    <div id="bubble" class="bubble" hidden></div>
    <div id="lights" class="lights"></div>

    <div id="tray" class="tray" hidden>
      <div class="tray-head"><span>なにをあげる？</span><button id="tray-close" class="icon-btn" aria-label="とじる">✕</button></div>
      <div id="tray-grid" class="tray-grid"></div>
    </div>

    <div id="dialog" class="dialog" hidden>
      <div id="dialog-text"></div>
      <div id="dialog-choices" class="choices"></div>
      <span class="caret">▼</span>
    </div>

    <div id="title" class="title-screen">
      <div class="logo">
        <span>ち</span><span>び</span><span>そ</span><span>だ</span><span>て</span>
      </div>
      <img src="sprites/egg.png" class="title-egg" alt="">
      <p class="tap-start">タップしてはじめる</p>
      <p class="ver" id="title-ver"></p>
    </div>
  </main>

  <!-- 下：ボタン -->
  <footer id="deck">
    <div id="actions" class="actions"></div>
  </footer>

  <div id="tapcatch" class="tapcatch" hidden></div>

  <!-- ずかん -->
  <section id="sheet" class="sheet" aria-hidden="true">
    <div class="sheet-head">
      <h2>ずかん</h2>
      <span id="zukan-count" class="count"></span>
      <button id="sheet-close" class="icon-btn" aria-label="とじる">✕</button>
    </div>
    <div id="zukan-grid" class="zukan-grid"></div>
  </section>

  <!-- せってい -->
  <section id="settings" class="sheet small" aria-hidden="true">
    <div class="sheet-head">
      <h2>せってい</h2>
      <button id="settings-close" class="icon-btn" aria-label="とじる">✕</button>
    </div>
    <div class="row"><span id="lbl-lang">言語 / 언어</span><select id="opt-lang" aria-label="言語 / 언어"><option value="ja">日本語</option><option value="ko">한국어</option></select></div>
    <label class="row"><span>効果音</span><input type="checkbox" id="opt-sound"></label>
    <div class="row"><span>おやすみ</span><span class="pair-sel"><select id="opt-bed" aria-label="ねる時刻"></select>〜<select id="opt-wake" aria-label="おきる時刻"></select></span></div>
    <label class="row"><span>天気を現実と連動 <small id="weather-now"></small></span><input type="checkbox" id="opt-weather"></label>
    <div class="row"><span>地域</span><select id="opt-city" aria-label="地域"></select></div>
    <label class="row" id="row-fast" hidden><span>テスト用はやおくり（×20）</span><input type="checkbox" id="opt-fast"></label>
    <button id="opt-reset" class="danger">データをぜんぶ消す</button>
    <div class="credits">
      <p>非公式の二次創作ファンゲームです。原作者さま・公式とは一切関係ありません。</p>
      <p>ちびそだて <span id="set-ver"></span></p>
    </div>
    <p id="reset-confirm" class="confirm" hidden>本当に消す？ <button id="reset-yes" class="danger">消す</button> <button id="reset-no">やめる</button></p>
  </section>
</div>

<script src="boot.js"></script>
</body>
</html>
